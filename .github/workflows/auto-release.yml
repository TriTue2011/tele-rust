name: Auto Release

# Mỗi lần đẩy lên main (trừ chính bản thân commit phát hành, tránh vòng lặp vô tận): tự tăng patch version,
# gắn thẻ, tạo GitHub Release — y hệt deploy/phat-hanh.py chạy tay, chỉ bỏ bước build.sh test (cần SSH tới
# máy dựng riêng trong mạng LAN nội bộ, cloud runner không với tới) vì ci.yml đã tự kiểm cargo test cho ĐÚNG
# commit này trong một workflow riêng chạy song song trên cùng lần push.
#
# BÀI HỌC 26/11: thẻ do GITHUB_TOKEN tự đẩy KHÔNG kích hoạt lại workflow Image/CI (GitHub tự chặn push do
# GITHUB_TOKEN gây ra kích hoạt lại workflow khác, tránh vòng lặp vô hạn) — mọi bản v0.7.33–v0.7.36 vì vậy
# CHƯA từng có ảnh dựng riêng cho đúng thẻ, chỉ có ảnh của lần đẩy main TRƯỚC ĐÓ (bằng PAT cá nhân, có kích
# hoạt thật). Sửa: KHÔNG dựa vào push:tags kích hoạt image.yml nữa — chủ động gọi workflow_dispatch của nó
# ngay sau khi tạo thẻ (lệnh workflow_dispatch qua API, không phải push, nên GITHUB_TOKEN gọi được bình thường).
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tự tăng phiên bản + tag + Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !startsWith(github.event.head_commit.message, 'release: v') &&
      !contains(github.event.head_commit.message, '[skip release]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cấu hình tác giả commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tăng phiên bản patch + tag + Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHAT_HANH_SKIP_BUILD_TEST: "1"
        run: python3 deploy/phat-hanh.py patch

      - name: Tự kích hoạt dựng ảnh cho đúng thẻ vừa tạo (push:tags bị GitHub chặn cascade từ GITHUB_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          gh workflow run image.yml --ref main -f tag="v${VER}"
