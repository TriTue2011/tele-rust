[package]
name = "telegram-gateway-rs"
version = "0.7.50"
edition = "2021"
description = "Gateway Telegram (tài khoản người dùng: tin nhắn + gọi thoại/video) cho Home Assistant — bản Rust, chạy song song bản Python"
publish = false

[[bin]]
name = "tggw"
path = "src/main.rs"

[dependencies]
# Mở libtdjson (TDLib 1.8.69, lấy từ wheel tdjson==1.8.69 — cùng bản với gateway Python) lúc chạy, nói chuyện bằng JSON.
libloading = "=0.8.6"
serde_json = { version = "=1.0.133", features = ["float_roundtrip"] }
axum = "=0.7.9"
base64 = "=0.22.1"
form_urlencoded = "=1.2.1"
subtle = "=2.6.1"
ring = "=0.17.14" # SHA-256 cho tên phiên tương thích Python; cũng là backend của rustls
# Gọi thoại/video P2P (WebRTC + báo hiệu tgcalls). ĐÚNG 3.0.7 = bản Python đang chạy ổn; build.rs tải ntgcalls.linux-x86_64-static_libs.zip
# chính thức của pytgcalls (GitHub release v3.0.7) và liên kết TĨNH (LGPL-3.0: phát hành công khai thì cân nhắc NTGCALLS_DYLIB).
ntgcalls = "=3.0.7"
# Chạy bất đồng bộ (ntgcalls 3.0.7 cũng dùng tokio).
tokio = { version = "=1.41.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "signal"] }
regex = "=1.11.1"
unicode-normalization = "=0.1.25"
icu_collator = "=2.1.1"
mime_guess = "=2.0.5"
rustix = { version = "=1.1.4", features = ["fs"] }
jpeg-encoder = "=0.6.1"
log = { version = "=0.4.35", features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
prost = "=0.13.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
# HTTPS tự ký trên cùng cổng HTTP (mic/webcam của trình duyệt cần ngữ cảnh an toàn): xem src/tls_serve.rs
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }
hyper-util = { version = "=0.1.19", features = ["server-auto", "tokio", "service", "http1", "http2"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
lto = false            # thư viện tĩnh C++ của NTgCalls không chứa bitcode LLVM → LTO của rustc lỗi «Can't find section .llvmbc»
codegen-units = 4
strip = true
